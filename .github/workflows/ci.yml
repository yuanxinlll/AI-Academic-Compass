# Runs on every push and pull request. A red check blocks merging into main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint app lib
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests (relevance, calendar, glossary)
        run: npm test
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # reported, not blocking: upstream advisories can land without a fix
      - name: Build
        run: npm run build
        env:
          # Placeholders only: the build must not need real secrets or a database.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-anywhere
          ADMIN_TOKEN: ci-placeholder-token
          NEXT_TELEMETRY_DISABLED: "1"

  collector:
    name: Collector — unit and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile collector/*.py
      - name: Tests (incl. prompt-injection fixtures)
        run: |
          set -e
          for f in collector/tests/test_*.py; do
            python -m unittest -v "collector.tests.$(basename "$f" .py)"
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists PR commits before scanning pull_request events.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
